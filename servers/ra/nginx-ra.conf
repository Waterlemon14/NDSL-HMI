log_format tls_timing '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      'ssl_protocol=$ssl_protocol '
                      'ssl_cipher=$ssl_cipher '
                      'ssl_client_verify=$ssl_client_verify '
                      'request_time=$request_time '
                      'upstream_connect_time=$upstream_connect_time '
                      'upstream_header_time=$upstream_header_time '
                      'upstream_response_time=$upstream_response_time';

# TLS-only (no client cert required)
server {
    listen 8443 ssl;

    ssl_certificate     /opt/ndsl-hmi/ra/id_server.crt;
    ssl_certificate_key /opt/ndsl-hmi/ra/id_server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         DEFAULT@SECLEVEL=1;

    access_log /var/log/nginx/ra_tls_access.log tls_timing;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# mTLS (client cert required, verified against root CA)
server {
    listen 8444 ssl;

    ssl_certificate        /opt/ndsl-hmi/ra/id_server.crt;
    ssl_certificate_key    /opt/ndsl-hmi/ra/id_server.key;
    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_ciphers            DEFAULT@SECLEVEL=1;

    ssl_client_certificate /opt/ndsl-hmi/ra/root-ca.crt;
    ssl_verify_client      on;

    access_log /var/log/nginx/ra_mtls_access.log tls_timing;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
    }
}

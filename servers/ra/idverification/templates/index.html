{% extends "base.html" %}

{% block script %}
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
{% endblock script %}

{% block content %}
  <h1 class="text-xl font-semibold">Scan ID</h1>
  <div id="results" style="visibility: hidden;">Results: </div>
  <div id="reader" class="w-[600px] max-w-full"></div>
  <button id="scanButton" onclick="startScan()" class="mt-4 px-4 py-2 text-white font-semibold bg-sky-500 rounded-xl hover:bg-sky-700">Scan QR</button>

  {% load static %}
  <script src="{% static 'script.js' %}"></script>

  <style>
    #reader img {
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    #reader button {
      color: #000;
      padding: 0.25rem 0.75rem;
      font-weight: 300;
      border: 1px solid #000;
    }
  </style>
{% endblock content %}

{% extends "base-sidebar.html" %}

{% block content %}
  <h1 class="text-xl font-semibold mb-3">View Devices</h1>
  <ol class="list-decimal list-inside">
    {% for device in user.devices.all %}
    <li>MAC: {{ device.mac }}, IP: {{ device.ip }}, Manufacturer: {{ device.manufacturer }}</li>
    {% endfor %}
  </ol>
{% endblock content %}
